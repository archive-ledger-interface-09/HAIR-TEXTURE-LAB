from pathlib import Path
p=Path('/mnt/data/hair_texture_lab_kam_voice.html')
s=p.read_text()
addon=r'''
<style id="mobile-save-style">
.save-photo-btn{background:var(--rose)!important;color:var(--paper)!important;font-weight:750!important}
.mobile-save-hint{font-size:11px;line-height:1.5;color:var(--mut);margin:7px 0}
</style>
<script id="mobile-save-script">
document.addEventListener('DOMContentLoaded',()=>{
 const main=document.querySelector('#export');
 if(!main)return;
 const hint=document.createElement('div');
 hint.className='mobile-save-hint';
 hint.textContent='On your phone, use “Save to Photos” to open your device’s share sheet. Choose Save Image on iPhone, or your gallery/photos app on Android when available.';
 main.closest('.toolbar')?.insertAdjacentElement('afterend',hint);

 function canvasBlob(canvas){
   return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not prepare PNG')),'image/png'));
 }
 function download(blob,name){
   const url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),30000);
 }
 async function save(canvas,name){
   try{
     const blob=await canvasBlob(canvas),file=new File([blob],name,{type:'image/png'});
     if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
       try{await navigator.share({files:[file],title:'My hair texture'});return}
       catch(e){if(e.name==='AbortError')return}
     }
     download(blob,name);
     alert('Your PNG was downloaded. If it does not appear in your gallery, open Downloads or Files, then share/save the image to Photos.');
   }catch(e){alert('I could not save this image. Try Export PNG instead.')}
 }
 function addSave(after,canvasGetter,name){
   if(!after)return;
   const btn=document.createElement('button');
   btn.type='button';btn.className='save-photo-btn';btn.textContent='Save to Photos';
   after.insertAdjacentElement('afterend',btn);
   btn.addEventListener('click',()=>{
     const canvas=canvasGetter();
     if(canvas)save(canvas,name);
     else alert('Upload an image first.');
   });
 }
 addSave(main,()=>{
   const source=document.querySelector('#cv');
   if(!source)return null;
   const r=Number(document.querySelector('#res')?.value)||1024;
   const oriented=typeof window.makeOrientedCanvas==='function'?window.makeOrientedCanvas(source):source;
   const out=document.createElement('canvas');out.width=out.height=r;
   out.getContext('2d').drawImage(oriented,0,0,r,r);
   return out;
 },'hair-texture.png');
 addSave(document.querySelector('#flipDownload'),()=>{
   if(!document.querySelector('#existingTextureFile')?.files?.length)return null;
   return document.querySelector('#flipCanvas');
 },'flipped-hair-texture.png');
 addSave(document.querySelector('#imgExport'),()=>{
   if(!document.querySelector('#hairImageFile')?.files?.length)return null;
   return document.querySelector('#imgCanvas')||document.querySelector('#imageHairCanvas')||null;
 },'image-hair-texture.png');
});
</script>
'''
s=s.replace('</body>',addon+'</body>',1)
out=Path('/mnt/data/hair_texture_lab_mobile_save.html')
out.write_text(s)
print(out, out.stat().st_size)
